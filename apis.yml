name: Looking Glass Networks
description: Looking Glass Networks, Inc. was a facilities-based telecommunications carrier founded in 2000
  and headquartered in Oak Brook, Illinois. It built, owned, and operated metropolitan fiber-optic networks
  (approximately 2,000 route miles across 14 major U.S. metro markets, serving roughly 215 buildings),
  providing SONET/SDH, wavelength, and Ethernet data-transport services along with dark fiber and
  carrier-neutral colocation. Backed by Battery Ventures and Madison Dearborn Partners, the company was
  acquired by Level 3 Communications on August 2, 2006 and no longer operates independently. It exposes no
  public API or developer surface.
